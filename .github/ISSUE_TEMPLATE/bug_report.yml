name: Bug report
description: Report a reproducible compiler, CLI, runtime, or diagnostics defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal UNIVERSAL source
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, UNIVERSAL commit/version, rustc and cargo versions.
    validations:
      required: true
